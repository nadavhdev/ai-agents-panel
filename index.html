<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<title>על מה נדבר עכשיו? · Building AI Agents for Production</title>
<style>
:root{color-scheme:only light;--purple:#8039DF;--deep:#3E0075;--lav:#F4F0FD;--line:#ECE6FA;--mint:#4CFEC8;--muted:#6B6680;--hot:#FF2370;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --pinhl:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9) 0 13%,rgba(255,255,255,0) 15%)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;min-height:100vh;background:#fff;color:var(--deep);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
main{position:relative;max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
main.voting{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{text-align:center}
.logo{display:block;width:80%;max-width:330px;height:auto;margin:12px auto 20px}
.pill{display:inline-block;background:var(--mint);color:var(--deep);font-size:11px;font-weight:800;letter-spacing:.16em;padding:6px 13px 5px;
  border-radius:20px;direction:ltr}
h1{margin:14px 0 0;font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.01em}
.sub{margin:6px 0 0;min-height:22px;color:var(--muted);font-size:15.5px}
.sub.new{color:var(--purple);font-weight:700}
.timer{position:sticky;top:0;z-index:5;margin:12px -16px 4px;padding:10px 16px 12px;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.timer .row{display:flex;align-items:baseline;justify-content:center;gap:7px;font-size:16px;font-weight:700}
.timer .num{font-size:30px;line-height:1;font-weight:800;color:var(--purple);min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums}
.timer .bar{height:8px;margin-top:8px;border-radius:4px;background:#EEE8F8;overflow:hidden}
.timer .bar i{display:block;height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,var(--mint),var(--purple));
  transition:width .25s linear}
.timer.urgent .num{color:var(--hot);animation:beat 1s ease-in-out infinite}
.timer.urgent .bar i{background:var(--hot)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin-top:10px;padding:4px 2px}
.tile{position:relative;display:flex;align-items:center;justify-content:center;min-height:112px;margin:0;padding:30px 12px 16px;
  border:1.5px solid var(--line);border-radius:18px;background:#fff;color:var(--deep);font:inherit;font-size:15.5px;font-weight:700;
  line-height:1.25;text-align:center;text-wrap:balance;cursor:pointer;transform:rotate(var(--r,0deg));
  box-shadow:0 6px 16px rgba(62,0,117,.08);-webkit-appearance:none;appearance:none;
  transition:transform .18s ease,box-shadow .2s ease,background .2s ease,color .2s ease,opacity .2s ease}
.tile:last-child:nth-child(odd){grid-column:1 / -1;justify-self:center;width:calc(50% - 6px)}
.tile .pin{position:absolute;left:50%;top:10px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:var(--pinhl),var(--purple);box-shadow:0 2px 4px rgba(30,11,58,.3)}
.tile .ok{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--deep);
  font-size:15px;font-weight:900;display:none;place-items:center;box-shadow:0 2px 6px rgba(10,122,75,.3)}
.tile:active{transform:rotate(var(--r,0deg)) scale(.96)}
.grid.has-choice .tile{opacity:.7}
.grid .tile.chosen{opacity:1;background:linear-gradient(160deg,#9150EC,#6A26D4);color:#fff;border-color:transparent;
  transform:rotate(0deg) scale(1.03);box-shadow:0 12px 26px rgba(106,38,212,.35)}
.tile.chosen .pin{background:var(--pinhl),var(--mint)}
.tile.chosen .ok{display:grid;animation:okpop .45s cubic-bezier(.3,1.7,.5,1)}
.grid.enter .tile{animation:pop .5s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(var(--i,0) * 45ms)}
.nw{white-space:nowrap}
.chip{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;max-width:492px;margin:0 auto;
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--deep);color:#fff;
  box-shadow:0 12px 30px rgba(30,11,58,.35);transform:translateY(170%);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.chip.show{transform:none}
.chip .ck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--deep);display:grid;place-items:center;
  font-weight:900}
.chip .tx{flex:1;min-width:0;font-size:15px;line-height:1.3}
.chip .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tx small{display:block;color:#CFC3EE;font-size:12.5px}
.wait{position:relative;margin:30px 6px 0;padding:46px 22px 30px;border-radius:26px;background:#fff;border:1.5px solid var(--line);
  text-align:center;box-shadow:0 14px 34px rgba(62,0,117,.10);transform:rotate(-1deg);animation:drop .55s cubic-bezier(.3,1.4,.5,1) backwards}
.wait .pin{position:absolute;left:50%;top:14px;width:24px;height:24px;margin-left:-12px;border-radius:50%;
  background:var(--pinhl),var(--purple);box-shadow:0 3px 5px rgba(30,11,58,.3)}
.wait .ico{width:92px;height:92px;margin:4px auto 18px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-size:46px}
.wait.done .ico{background:var(--mint);color:var(--deep);font-size:44px;font-weight:900}
.wait .ttl{display:block;font-size:31px;line-height:1.15;font-weight:800;text-wrap:balance}
.wait .msg{margin:10px 0 0;color:var(--muted);font-size:16px;line-height:1.45}
.wait .live{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:8px 15px;border-radius:20px;background:#EAFFF6;
  color:#0A7A4B;font-style:normal;font-weight:700;font-size:14px}
.wait .live i{width:9px;height:9px;border-radius:50%;background:#14B86A;animation:live 1.6s ease-in-out infinite}
.status{margin:16px 0 0;min-height:22px;text-align:center;color:var(--muted);font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(16px) rotate(var(--r,0deg)) scale(.92)}to{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes okpop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes live{0%,100%{box-shadow:0 0 0 3px rgba(20,184,106,.22)}50%{box-shadow:0 0 0 7px rgba(20,184,106,.05)}}
@keyframes drop{from{opacity:0;transform:translateY(-12px) rotate(-3deg)}to{opacity:1;transform:rotate(-1deg)}}
@media (prefers-reduced-motion:reduce){.tile,.chip,.timer .bar i{transition:none}
  .grid.enter .tile,.wait,.tile.chosen .ok,.timer.urgent .num,.wait .live i{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="logo.png" alt="Think Outside The Loop · Gong/Loop · Band" width="1209" height="216">
    <span class="pill">BUILDING AI AGENTS FOR PRODUCTION</span>
    <h1>על מה נדבר עכשיו?</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div id="app"></div>
  <p id="status" class="status" aria-live="polite"></p>
</main>
<div class="chip" id="chip" aria-live="polite"><span class="ck">✓</span><span class="tx"><b id="chipTopic"></b><small>הקול שלך נקלט · אפשר להחליף עד שהזמן נגמר</small></span></div>
<script src="config.js"></script>
<script>
const CATS = [{"id": 0, "html": "מה שונה בניטור agent?", "text": "מה שונה בניטור agent?"}, {"id": 1, "html": "סיפור מהשטח <span class=\"nw\">(war story)</span>", "text": "סיפור מהשטח (war story)"}, {"id": 2, "html": "המודל אשם?", "text": "המודל אשם?"}, {"id": 3, "html": "מי מתעורר בשלוש בלילה? 😂", "text": "מי מתעורר בשלוש בלילה? 😂"}, {"id": 4, "html": "שדרוג והחלפת מודלים", "text": "שדרוג והחלפת מודלים"}, {"id": 5, "html": "איך מתמודדים עם backward compatibility?", "text": "איך מתמודדים עם backward compatibility?"}, {"id": 6, "html": "עלויות לאורך זמן", "text": "עלויות לאורך זמן"}, {"id": 7, "html": "<span class=\"nw\">ה-agent</span> השתנה לבד <span class=\"nw\">(drift)</span>", "text": "ה-agent השתנה לבד (drift)"}, {"id": 8, "html": "agents שמדברים עם agents", "text": "agents שמדברים עם agents"}, {"id": 9, "html": "ידע וזיכרון שמתיישנים", "text": "ידע וזיכרון שמתיישנים"}, {"id": 10, "html": "מה עושים עם כל הדאטה <span class=\"nw\">מ-production</span>?", "text": "מה עושים עם כל הדאטה מ-production?"}, {"id": 11, "html": "<span class=\"nw\">ה-agent</span> עדיין שווה את זה?", "text": "ה-agent עדיין שווה את זה?"}];
const ANG = [-1.3, 0.9, 1.1, -0.8, -0.6, 1.3, 1.0, -1.1, -1.2, 0.7, 0.8, -0.9];
const cfg = window.PANEL_VOTE_CONFIG || {};
const ready = cfg.supabaseUrl && cfg.supabaseKey && !/YOUR-/.test(cfg.supabaseUrl + cfg.supabaseKey);
const main = document.querySelector('main'), app = document.getElementById('app'), statusEl = document.getElementById('status');
const sub = document.getElementById('sub'), chip = document.getElementById('chip'), chipTopic = document.getElementById('chipTopic');
let device = null;
try { device = localStorage.getItem('panel-device'); } catch (e) {}
if (!device) {
  device = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { localStorage.setItem('panel-device', device); } catch (e) {}
}
const mine = {}, seen = {};
function myVote(r) { if (r in mine) return mine[r]; try { const v = localStorage.getItem('panel-vote-' + r); return v === null ? null : +v; } catch (e) { return null; } }
function setMyVote(r, c) { mine[r] = c; try { localStorage.setItem('panel-vote-' + r, String(c)); } catch (e) {} }
function clearMyVote(r) { mine[r] = null; try { localStorage.removeItem('panel-vote-' + r); } catch (e) {} }
let st = null, lastRound = null, sending = false, endsAt = null, shown = null, drawnRound = null;
function status(t) { statusEl.textContent = t; }
async function rpc(fn, body) {
  const h = {'Content-Type': 'application/json', apikey: cfg.supabaseKey};
  if (!String(cfg.supabaseKey).startsWith('sb_')) h.Authorization = 'Bearer ' + cfg.supabaseKey;
  const r = await fetch(String(cfg.supabaseUrl).replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {method: 'POST', headers: h, body: JSON.stringify(body || {})});
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
const isOpen = () => !!(st && st.open && st.options && st.options.length && (endsAt === null || Date.now() < endsAt));
function waitCard(done) {
  return `<div class="wait${done ? ' done' : ''}"><span class="pin"></span>` + (done
    ? '<div class="ico">✓</div><b class="ttl">ההצבעה נסגרה</b><p class="msg">תודה! ההצבעה הבאה תיפתח בקרוב.</p><em class="live"><i></i>מחכים להצבעה הבאה</em>'
    : '<div class="ico">🗳️</div><b class="ttl">ההצבעה עדיין לא פתוחה</b><p class="msg">השאירו את הדף פתוח. כשההצבעה תיפתח, הנושאים יופיעו כאן.</p><em class="live"><i></i>מחכים להצבעה</em>') + '</div>';
}
function render() {
  shown = isOpen();
  main.classList.toggle('voting', shown);
  if (!shown) {
    app.innerHTML = waitCard(!!(st && seen[st.round]));
    sub.textContent = ''; sub.className = 'sub'; chip.classList.remove('show'); drawnRound = null;
    return;
  }
  seen[st.round] = true;
  const fresh = drawnRound !== st.round, isNew = lastRound !== null && lastRound !== st.round;
  drawnRound = st.round;
  const opts = CATS.filter(c => st.options.includes(c.id));
  app.innerHTML = (endsAt ? '<div class="timer" id="timer"><div class="row"><span class="lead"></span><b class="num"></b><span class="unit"></span></div><div class="bar"><i></i></div></div>' : '') +
    `<div class="grid${fresh ? ' enter' : ''}">` + opts.map((c, k) =>
      `<button class="tile" data-id="${c.id}" type="button" style="--r:${ANG[c.id % ANG.length]}deg;--i:${k}"><span class="pin"></span><span class="ok">✓</span><span class="t">${c.html}</span></button>`
    ).join('') + '</div>';
  app.querySelectorAll('.tile').forEach(b => { b.onclick = () => vote(+b.dataset.id); });
  sub.textContent = isNew ? 'הצבעה חדשה! בחרו את הנושא הבא' : 'בחרו את הנושא שהכי מעניין אתכם';
  sub.className = 'sub' + (isNew ? ' new' : '');
  markChoice(myVote(st.round)); drawTimer();
}
function markChoice(id) {
  const grid = app.querySelector('.grid');
  const valid = id !== null && st && st.options.includes(id);
  if (grid) {
    grid.classList.toggle('has-choice', valid);
    grid.querySelectorAll('.tile').forEach(t => t.classList.toggle('chosen', valid && +t.dataset.id === id));
  }
  const c = valid && CATS.find(x => x.id === id);
  if (c) { chipTopic.textContent = 'הצבעת: ' + c.text; chip.classList.add('show'); } else chip.classList.remove('show');
}
function drawTimer() {
  const el = document.getElementById('timer');
  if (!el || !endsAt) return;
  const left = Math.max(0, endsAt - Date.now()), sec = Math.ceil(left / 1000), total = (st && st.seconds) || 20;
  el.querySelector('.lead').textContent = sec === 1 ? 'נותרה' : 'נותרו';
  el.querySelector('.num').textContent = String(sec);
  el.querySelector('.unit').textContent = sec === 1 ? 'שנייה להצבעה' : 'שניות להצבעה';
  el.querySelector('.bar i').style.width = Math.max(0, Math.min(100, left / (total * 10))) + '%';
  el.classList.toggle('urgent', sec <= 5);
}
setInterval(() => { if (!st) return; if (shown !== isOpen()) render(); else drawTimer(); }, 250);
async function vote(id) {
  if (sending || !isOpen()) return;
  const round = st.round, prev = myVote(round);
  if (prev === id) return;
  sending = true;
  setMyVote(round, id); markChoice(id); status('');
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  const undo = () => { if (prev === null) clearMyVote(round); else setMyVote(round, prev); };
  try {
    const r = await rpc('panel_vote', {p_device: device, p_choice: id});
    if (!r || !r.ok) { undo(); await refresh(true); }
  } catch (e) { undo(); if (st && st.round === round) markChoice(prev); status('אין חיבור, נסו שוב בעוד רגע'); }
  sending = false;
}
async function refresh(force) {
  try {
    const s = await rpc('panel_get_state');
    const changed = force === true || !st || s.round !== st.round || s.open !== st.open || String(s.options) !== String(st.options);
    if (st && s.round !== st.round) lastRound = st.round;
    const est = s.open && typeof s.remaining === 'number' ? Date.now() + s.remaining * 1000 : null;
    if (est === null) endsAt = null;
    else if (endsAt === null || changed || Math.abs(est - endsAt) > 1500) endsAt = est;
    st = s;
    if (statusEl.textContent === 'מתחבר להצבעה…') status('');
    if (changed || shown !== isOpen()) render();
  } catch (e) { if (!st) app.innerHTML = ''; status('מתחבר להצבעה…'); }
}
let timer;
function loop() { clearTimeout(timer); if (document.visibilityState === 'visible') refresh(); timer = setTimeout(loop, 2200 + Math.random() * 700); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loop(); });
if (!ready) app.innerHTML = '<div class="wait"><span class="pin"></span><b class="ttl">הדף עוד לא מחובר</b><p class="msg">צריך למלא את config.js לפי ההוראות.</p></div>';
else loop();
</script>
</body>
</html>
